<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A4DAF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pyramiden">
<title>Zahlenpyramiden · Yuna</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --ink: #4A3121;            /* Capybara-Dunkelbraun, für Text */
    --soft: #8A6A52;
    --cream: #FFFBF0;
    --stone: #F7E2B2;
    --stone-2: #F0D193;
    --stone-edge: #D6AC67;
    --stone-ink: #5A3A1C;
    --leaf: #CDF2B4;
    --leaf-2: #ADE58C;
    --leaf-edge: #78C056;
    --leaf-ink: #2C5A19;
    --hole: rgba(255, 253, 246, 0.94);
    --hole-edge: #E0BE82;
    --sel: #FFC21F;
    --err: #FF8C7A;
    --orange: #FF9F1C;
    --water-1: #93DAF0;
    --water-2: #5DBCDF;
    --green: #6CC955;
    --green-edge: #4EA63A;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Quicksand", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #A4DAF5;
    color: var(--ink);
    font-family: var(--font);
    font-weight: 700;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;   /* kein Zoom bei schnellem Doppeltipp */
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid #2E86AB; outline-offset: 3px; }
  svg { display: block; }

  /* ---------- Landschaft im Hintergrund ---------- */
  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(180deg, #A4DAF5 0%, #C9EDFC 26%, #EEF9F2 40%, #F6FBE4 46%);
  }
  .meadow {
    position: absolute;
    left: 0; right: 0; top: 45%; bottom: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0 / 46px 38px,
      radial-gradient(circle at 70% 70%, rgba(80,150,50,.12) 0 2px, transparent 3px) 0 0 / 58px 44px,
      linear-gradient(180deg, #ABDD88 0%, #93D16E 45%, #82C65E 100%);
  }
  .hills { position: absolute; left: 0; width: 100%; top: 31%; height: 15%; }
  .sun {
    position: absolute;
    top: 7%;
    right: 4%;
    width: clamp(70px, 13vw, 130px);
  }
  .sun .rays { transform-origin: 60px 60px; animation: spin 40s linear infinite; }
  .cloud { position: absolute; fill: #fff; opacity: .95; }
  .cloud.c1 { top: 10%; width: clamp(90px, 16vw, 170px); animation: drift 70s linear infinite; animation-delay: -20s; }
  .cloud.c2 { top: 20%; width: clamp(70px, 11vw, 120px); opacity: .85; animation: drift 95s linear infinite; animation-delay: -70s; }
  .cloud.c3 { top: 4%; width: clamp(60px, 9vw, 100px); opacity: .75; animation: drift 120s linear infinite; animation-delay: -35s; }
  .tree { position: absolute; left: 3%; top: calc(45% - clamp(64px, 12vw, 130px) * 1.1); width: clamp(64px, 12vw, 130px); }
  .tree.t2 { left: auto; right: 9%; top: calc(43% - clamp(40px, 7vw, 76px) * 1.1); width: clamp(40px, 7vw, 76px); opacity: .9; }
  .deco { position: absolute; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  /* ---------- Aufbau ---------- */
  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "bar" "stage" "dock";
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* Kopfzeile */
  .bar {
    grid-area: bar;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 4px;
  }
  .pill {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 999px;
    box-shadow: 0 3px 0 rgba(60, 120, 150, 0.12), 0 8px 18px -10px rgba(40, 90, 120, 0.5);
  }
  .level { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 5px; }
  .level .num {
    min-width: 36px; height: 36px; padding: 0 6px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: var(--green);
    color: #fff;
    font-size: 19px; font-weight: 800;
    box-shadow: inset 0 -3px 0 var(--green-edge);
  }
  .level .lbl { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
  .level .lbl small { font-size: 13px; color: var(--soft); font-weight: 800; letter-spacing: .02em; }
  .track { width: clamp(54px, 15vw, 120px); height: 9px; border-radius: 99px; background: #E4F2D9; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #A6E488, #5DB84B); transition: width .9s cubic-bezier(.3,1.3,.5,1); }
  .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #2F7FA8;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
    letter-spacing: .01em;
    visibility: hidden;
  }
  .count { display: flex; align-items: center; gap: 5px; padding: 3px 14px 3px 5px; font-size: 21px; font-weight: 800; }
  .count svg { width: 34px; height: 34px; }
  .count.bump { animation: bump .5s ease-out; }
  .round {
    width: 44px; height: 44px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--soft);
  }
  .round svg { width: 24px; height: 24px; }
  @media (min-width: 560px) { .title { visibility: visible; } }

  /* Bühne mit der Pyramide */
  .stage {
    grid-area: stage;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0 16px;
  }
  /* Pyramide und Boden mit den Freunden bilden eine Gruppe, mittig im freien Platz */
  .pyr-box {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-top: 6px;
  }
  .pyr-wrap { display: flex; justify-content: center; }
  .ground { flex: none; height: clamp(30px, 6.5vh, 62px); position: relative; margin-top: 4px; }

  .pyramid {
    --bw: 80px; --bh: 58px; --gap: 6px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
  }
  .pyramid::after {
    content: "";
    position: absolute;
    left: -6%; right: -6%;
    bottom: calc(var(--bh) * -0.32);
    height: calc(var(--bh) * 0.6);
    background: radial-gradient(ellipse at center, rgba(52, 100, 30, 0.32), rgba(52, 100, 30, 0) 70%);
    z-index: -1;
  }
  .crown { width: calc(var(--bh) * 0.9); height: calc(var(--bh) * 0.8); display: grid; place-items: end center; }
  .crown svg { width: 100%; height: 100%; animation: sway 3s ease-in-out infinite; transform-origin: 50% 90%; }
  .row { display: flex; gap: var(--gap); }
  .cell {
    position: relative;
    width: var(--bw);
    height: var(--bh);
    border-radius: calc(var(--bw) * 0.17);
    display: grid;
    place-items: center;
    font-size: calc(var(--bw) * 0.43);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--stone-ink);
  }
  .cell.given {
    background: linear-gradient(180deg, var(--stone) 0%, var(--stone-2) 100%);
    box-shadow: inset 0 calc(var(--bh) * -0.09) 0 var(--stone-edge), inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 rgba(90, 58, 28, 0.15);
    cursor: default;
  }
  .cell.solved {
    background: linear-gradient(180deg, var(--leaf) 0%, var(--leaf-2) 100%);
    color: var(--leaf-ink);
    box-shadow: inset 0 calc(var(--bh) * -0.09) 0 var(--leaf-edge), inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 rgba(44, 90, 25, 0.15);
    cursor: default;
  }
  .cell.blank {
    background: var(--hole);
    border: 3px dashed var(--hole-edge);
    color: #2D6E8E;
  }
  .cell.blank.sel { background: #FFFDF0; border: 3px solid var(--sel); }
  .cell.wrong { background: #FFE0DA !important; border-color: var(--err) !important; }
  .cell::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: calc(var(--bw) * 0.22);
    pointer-events: none;
    opacity: 0;
  }
  .cell.sel::after { opacity: 1; border: 4px solid rgba(255, 194, 31, 0.55); animation: glow 1.3s ease-in-out infinite; }
  .cell.hint::after { opacity: 1; border: 4px solid var(--orange); animation: nudge .9s ease-in-out infinite; }
  .cell.hint { color: #B85A00; }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .caret {
    display: inline-block;
    width: 3px;
    height: .82em;
    margin-left: 2px;
    border-radius: 2px;
    background: currentColor;
    animation: blink 1s steps(1) infinite;
  }
  .cell .typed { display: inline-flex; align-items: center; }
  .cell.build { animation: drop .55s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: var(--d, 0s); }
  .cell.pop { animation: pop .45s ease-out; }
  .cell.shake { animation: shake .45s ease-in-out; }
  .pyramid.cheer .cell { animation: cheer .6s ease-in-out both; animation-delay: var(--w, 0s); }

  @keyframes drop {
    0% { transform: translateY(-80%) scale(.7); opacity: 0; }
    60% { transform: translateY(5%) scale(1.03); opacity: 1; }
    100% { transform: none; opacity: 1; }
  }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 70% { transform: scale(.95); } 100% { transform: scale(1); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(7px) rotate(2deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  @keyframes cheer { 0%, 100% { transform: none; } 40% { transform: translateY(-14%) scale(1.06); } }
  @keyframes glow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: .5; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* Freunde, die nach und nach dazukommen */
  .friend { position: absolute; display: none; filter: drop-shadow(0 3px 0 rgba(52, 100, 30, 0.2)); }
  .friend.on { display: block; }
  .friend.arrive { animation: arrive .9s cubic-bezier(.3, 1.5, .5, 1) both; }
  /* Grösse folgt der Höhe des Bodens, damit niemand in die Pyramide ragt */
  .ground .friend { bottom: 0; width: auto; }
  /* links bleibt Platz für Capy, rechts für den Frosch auf dem Seerosenblatt */
  .f-schildkroete { left: 37%; height: 74%; aspect-ratio: 72 / 46; }
  .f-ente { left: 55%; height: 80%; aspect-ratio: 58 / 48; }
  .f-baby { right: 19%; height: 96%; aspect-ratio: 80 / 74; }
  .lily .f-frosch { left: 24%; bottom: 46%; width: 56%; }
  .f-schmetterling { top: 6%; left: 6%; width: clamp(36px, 6vw, 58px); }
  .f-schmetterling.on { animation: flutter 9s ease-in-out infinite; }
  .f-schmetterling svg { animation: flap .35s ease-in-out infinite alternate; }
  @keyframes arrive { 0% { transform: translateY(40px) scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.55); } }
  @keyframes flutter {
    0%, 100% { transform: translate(0, 0) rotate(-6deg); }
    25% { transform: translate(40px, 18px) rotate(8deg); }
    50% { transform: translate(80px, -6px) rotate(-4deg); }
    75% { transform: translate(30px, -14px) rotate(6deg); }
  }

  /* ---------- Teich unten: Capy, Sprechblase, Tasten ---------- */
  .dock {
    grid-area: dock;
    position: relative;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    border-radius: 30px 30px 0 0;
    background:
      radial-gradient(ellipse 60px 8px at 18% 70%, rgba(255,255,255,.28), transparent 70%),
      radial-gradient(ellipse 80px 9px at 78% 88%, rgba(255,255,255,.22), transparent 70%),
      radial-gradient(ellipse 50px 7px at 62% 40%, rgba(255,255,255,.2), transparent 70%),
      linear-gradient(180deg, var(--water-1) 0%, var(--water-2) 100%);
    box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.45), 0 -6px 20px -12px rgba(30, 90, 120, 0.5);
  }
  .lily { position: absolute; right: 10px; top: -20px; width: clamp(64px, 12vw, 96px); pointer-events: none; }
  .lily > svg:first-child { width: 100%; height: auto; }
  .buddy {
    --capy: clamp(104px, 29vw, 136px);
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-bottom: 12px;
    padding-left: calc(var(--capy) - 8px);
  }
  /* Capy sitzt im Teich und schaut über den Rand */
  .capy {
    position: absolute;
    left: -6px;
    bottom: calc(100% - var(--capy) * 0.42);
    width: var(--capy);
    overflow: visible;
    z-index: 1;
  }
  .capy .bob { animation: bob 3.2s ease-in-out infinite; }
  .capy .eyes-open { transform-box: fill-box; transform-origin: center; animation: blinkeye 4.6s infinite; }
  .capy .eyes-happy { display: none; }
  .capy.happy .eyes-open { display: none; }
  .capy.happy .eyes-happy { display: inline; }
  .capy.happy .bob { animation: hop .5s ease-out 2; }
  .capy.oops .bob { animation: tilt .7s ease-in-out; transform-origin: 70px 120px; }
  .capy .vogel { display: none; }
  .capy .vogel.on { display: inline; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2.5px); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
  @keyframes tilt { 25% { transform: rotate(-7deg); } 75% { transform: rotate(5deg); } }
  @keyframes blinkeye { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }

  .bubble {
    flex: 1;
    min-width: 0;
    position: relative;
    min-height: 66px;
    padding: 10px 14px;
    border-radius: 20px;
    background: #fff;
    display: flex;
    align-items: center;
    font-size: clamp(15px, 4.2vmin, 19px);
    line-height: 1.25;
    box-shadow: 0 4px 0 rgba(30, 90, 120, 0.15);
    z-index: 2;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 18px;
    width: 18px; height: 18px;
    background: #fff;
    transform: rotate(45deg);
    border-radius: 3px;
  }
  .bubble span { position: relative; }
  .bubble.pop { animation: talk .35s ease-out; }
  .bubble .op { color: #E07B00; white-space: nowrap; }
  @keyframes talk { 0% { transform: scale(.94); } 60% { transform: scale(1.02); } 100% { transform: none; } }

  .tipp {
    flex: none;
    width: 66px;
    align-self: stretch;
    min-height: 66px;
    border-radius: 20px;
    background: #FFF4C7;
    color: #9A6A00;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 14px; font-weight: 800;
    box-shadow: 0 4px 0 #E8C969;
  }
  .tipp svg { width: 30px; height: 30px; }
  .tipp:active { transform: translateY(3px); box-shadow: 0 1px 0 #E8C969; }

  .controls { display: grid; }
  .controls > * { grid-area: 1 / 1; }
  .pad {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-areas: "k1 k2 k3 k4 k5 kb" "k6 k7 k8 k9 k0 ko";
  }
  .key {
    height: clamp(50px, 7.4vh, 72px);
    border-radius: 18px;
    background: var(--cream);
    color: var(--stone-ink);
    font-size: clamp(25px, 3.9vh, 34px);
    font-weight: 800;
    display: grid; place-items: center;
    box-shadow: 0 5px 0 #D8C39A, 0 8px 14px -6px rgba(20, 70, 100, 0.45);
    transition: transform .06s;
  }
  .key:active { transform: translateY(4px); box-shadow: 0 1px 0 #D8C39A, 0 3px 8px -6px rgba(20, 70, 100, 0.45); }
  .key svg { width: 30px; height: 30px; }
  .key.back { background: #FFE2CF; color: #B4532A; box-shadow: 0 5px 0 #E9B697, 0 8px 14px -6px rgba(20, 70, 100, 0.45); }
  .key.ok { background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-edge), 0 8px 14px -6px rgba(20, 70, 100, 0.45); }
  .key.back:active { box-shadow: 0 1px 0 #E9B697; }
  .key.ok:active { box-shadow: 0 1px 0 var(--green-edge); }
  .key[data-k="1"] { grid-area: k1; } .key[data-k="2"] { grid-area: k2; } .key[data-k="3"] { grid-area: k3; }
  .key[data-k="4"] { grid-area: k4; } .key[data-k="5"] { grid-area: k5; } .key[data-k="6"] { grid-area: k6; }
  .key[data-k="7"] { grid-area: k7; } .key[data-k="8"] { grid-area: k8; } .key[data-k="9"] { grid-area: k9; }
  .key[data-k="0"] { grid-area: k0; } .key.back { grid-area: kb; } .key.ok { grid-area: ko; }

  .next {
    visibility: hidden;
    border-radius: 22px;
    background: var(--green);
    color: #fff;
    font-size: clamp(22px, 3.6vh, 30px);
    font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 6px 0 var(--green-edge), 0 10px 18px -8px rgba(20, 70, 100, 0.5);
  }
  .next svg { width: 34px; height: 34px; }
  .next:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-edge); }
  .dock.done .pad { visibility: hidden; }
  .dock.done .next { visibility: visible; animation: popin .5s cubic-bezier(.3, 1.5, .5, 1) both; }
  .dock.done .tipp { visibility: hidden; }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Querformat: Teich rechts als eigene Spalte */
  @media (orientation: landscape) and (min-width: 700px) {
    .app {
      max-width: 1320px;
      grid-template-columns: minmax(0, 1fr) clamp(310px, 31vw, 410px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "bar bar" "stage dock";
    }
    .dock {
      margin: 6px 16px calc(16px + env(safe-area-inset-bottom)) 0;
      padding: 18px 16px 18px;
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* In der schmalen Spalte sitzt Capy über der Sprechblase statt daneben */
    .buddy { --capy: clamp(84px, 11.5vw, 150px); padding-left: 0; padding-top: calc(var(--capy) * 0.8); }
    .f-schildkroete { left: 5%; }
    .f-ente { left: 22%; }
    .f-baby { right: 6%; }
    .capy { left: 4px; top: 0; bottom: auto; }
    .bubble::before { left: calc(var(--capy) * 0.5 - 4px); top: -8px; }
    .lily { top: -22px; right: 4px; width: clamp(56px, 6vw, 84px); }
  }
  @media (orientation: landscape) and (min-width: 700px) and (min-height: 620px) {
    .pad {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-areas: "k1 k2 k3" "k4 k5 k6" "k7 k8 k9" "kb k0 ko";
      gap: 10px;
    }
    .key { height: clamp(58px, 9.6vh, 88px); font-size: clamp(26px, 4.2vh, 38px); }
    .buddy { margin-bottom: 18px; }
    .bubble { font-size: clamp(16px, 2.4vh, 20px); }
    .lily { top: auto; bottom: -14px; right: -12px; width: clamp(64px, 7vw, 96px); }
  }

  /* ---------- Einblendungen ---------- */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(10px + env(safe-area-inset-top));
    z-index: 30;
    display: flex; align-items: center; gap: 12px;
    max-width: calc(100% - 32px);
    padding: 10px 20px 10px 12px;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 6px 0 rgba(60, 120, 150, 0.15), 0 16px 30px -12px rgba(30, 80, 110, 0.55);
    transform: translate(-50%, -160%);
    transition: transform .5s cubic-bezier(.3, 1.4, .5, 1);
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast .ic { width: 58px; height: 58px; flex: none; }
  .toast .ic svg { width: 100%; height: 100%; }
  .toast b { display: block; font-size: 19px; font-weight: 800; }
  .toast span { display: block; font-size: 15px; color: var(--soft); }

  .fx { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
  .fx svg { position: absolute; top: 0; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    grid-template-columns: minmax(0, 460px);
    place-content: center;
    padding: 16px;
    background: rgba(110, 185, 220, 0.5);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
  }
  .overlay[hidden] { display: none; }
  .card {
    width: 100%;
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - 32px);
    overflow: auto;
    padding: 20px 22px 18px;
    border-radius: 30px;
    background: var(--cream);
    text-align: center;
    box-shadow: 0 8px 0 rgba(60, 120, 150, 0.18), 0 26px 50px -20px rgba(30, 80, 110, 0.6);
    animation: popin .45s cubic-bezier(.3, 1.4, .5, 1) both;
  }
  .card .capy-big { width: 120px; margin: -4px auto 4px; }
  .card h1 { margin: 0 0 4px; font-size: 30px; font-weight: 800; }
  .card p { margin: 6px 0; font-size: 17px; line-height: 1.35; font-weight: 700; }
  .card .lead { color: var(--soft); }
  .demos { display: flex; justify-content: center; gap: 22px; margin: 16px 0 6px; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .demo .cell { --bw: 54px; --bh: 40px; }
  .demo .row + .row { margin-top: 4px; }
  .demo .row { gap: 4px; justify-content: center; }
  .demo .eq { margin-top: 6px; font-size: 18px; font-weight: 800; color: #E07B00; }
  .go {
    margin-top: 14px;
    width: 100%;
    height: 62px;
    border-radius: 22px;
    background: var(--green);
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    box-shadow: 0 6px 0 var(--green-edge);
  }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-edge); }
  .parents {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px dashed #EBDDBF;
    font-size: 13px;
    color: var(--soft);
    display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: center;
  }
  .parents button { font-size: 13px; font-weight: 800; color: #B4532A; text-decoration: underline; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

<script>
'use strict';

/* =====================================================================
   STUFEN
   Die Schwierigkeit wächst über diese Tabelle. Felder:
     n      Stockwerke (Steine in der Grundreihe)
     max    grösste Zahl, die in der Pyramide vorkommen darf
     leer   wie viele Steine fehlen [mindestens, höchstens]
     minus  wie viele davon sich nur mit Minus ausrechnen lassen
     unten  true = die Grundreihe steht immer da, es reicht Plus
   ===================================================================== */
const LEVELS = [
  { n: 3, max: 10, leer: [2, 3],   minus: [0, 0], unten: true },
  { n: 3, max: 20, leer: [3, 3],   minus: [0, 0], unten: true },
  { n: 3, max: 20, leer: [3, 3],   minus: [1, 1] },
  { n: 4, max: 20, leer: [4, 6],   minus: [0, 0], unten: true },
  { n: 3, max: 30, leer: [3, 3],   minus: [1, 3] },
  { n: 4, max: 30, leer: [5, 6],   minus: [1, 2] },
  { n: 4, max: 50, leer: [6, 6],   minus: [2, 6] },
  { n: 5, max: 40, leer: [7, 10],  minus: [0, 0], unten: true },
  { n: 5, max: 50, leer: [8, 10],  minus: [1, 3] },
  { n: 5, max: 50, leer: [10, 10], minus: [3, 10] },
  { n: 6, max: 50, leer: [10, 15], minus: [0, 0], unten: true },
  { n: 6, max: 50, leer: [13, 15], minus: [2, 15] },
];

// Freunde, die nach so vielen gelösten Pyramiden dazukommen
const FRIENDS = [
  { id: 'schmetterling', at: 2,  name: 'Schmetterling', text: 'Ein Schmetterling ist zu Besuch!' },
  { id: 'vogel',         at: 4,  name: 'Vogel',         text: 'Ein Vogel setzt sich zu Capy.' },
  { id: 'schildkroete',  at: 7,  name: 'Schildkröte',   text: 'Eine Schildkröte kommt vorbei.' },
  { id: 'frosch',        at: 11, name: 'Frosch',        text: 'Ein Frosch hüpft herbei!' },
  { id: 'ente',          at: 16, name: 'Ente',          text: 'Eine Ente watschelt herbei.' },
  { id: 'baby',          at: 22, name: 'Capybara-Baby', text: 'Ein Capybara-Baby will mitspielen!' },
];

const TEXT = {
  start: ['Los geht\'s! Welche Zahlen fehlen?', 'Neue Pyramide! Du schaffst das.', 'Hier kommt die nächste Pyramide!', 'Bereit? Dann los!', 'Auf geht\'s, Yuna!'],
  first: 'Welche Zahl gehört in den leuchtenden Stein? Tippe sie ein und drücke ✓.',
  ok: ['Super!', 'Richtig!', 'Genau!', 'Toll!', 'Prima!', 'Juhu!', 'Klasse!', 'Stimmt!', 'Sehr gut!'],
  wrong: ['Hmm, das stimmt noch nicht. Probier\'s nochmal!', 'Fast! Rechne nochmal nach.', 'Nicht ganz. Du schaffst das!'],
  tricky: 'Dieser Stein ist noch knifflig. Fang hier an!',
  done: ['Geschafft, Yuna!', 'Pyramide fertig!', 'Wunderbar!', 'Super gemacht!', 'Bravo, Yuna!'],
  facts: [
    'Wusstest du? Capybaras sind die grössten Nagetiere der Welt.',
    'Wusstest du? Capybaras leben in Südamerika, immer nahe am Wasser.',
    'Wusstest du? Capybaras können sehr gut schwimmen.',
    'Wusstest du? Capybaras haben kleine Schwimmhäute zwischen den Zehen.',
    'Wusstest du? Capybaras können bis zu fünf Minuten tauchen.',
    'Wusstest du? Capybaras fressen Gras und Wasserpflanzen.',
    'Wusstest du? Capybaras leben gern in Gruppen zusammen.',
    'Wusstest du? Vögel sitzen oft auf dem Rücken von Capybaras.',
    'Wusstest du? Ein anderer Name für Capybara ist Wasserschwein.',
    'Wusstest du? Augen, Ohren und Nase sitzen oben am Kopf. So schaut Capy auch beim Schwimmen.',
    'Wusstest du? In Japan baden Capybaras im Winter in warmen Quellen, mit Zitrusfrüchten im Wasser.',
  ],
};

/* ===== Hilfsfunktionen ===== */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const range = n => Array.from({ length: n }, (_, i) => i);
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =====================================================================
   PYRAMIDE
   Stein (r, i): Reihe r von unten (0 = Grundreihe), Platz i von links.
   Reihe r hat n − r Steine; alle liegen in einem flachen Array.
   Jedes «Dreieck» ist ein Stein mit den zwei Steinen darunter:
   oben = links + rechts.
   ===================================================================== */
const shapes = {};
function shape(n) {
  if (shapes[n]) return shapes[n];
  const cells = [], at = [];
  for (let r = 0; r < n; r++) {
    at.push([]);
    for (let i = 0; i < n - r; i++) { at[r].push(cells.length); cells.push({ r, i }); }
  }
  const tris = [];
  for (let r = 1; r < n; r++) {
    for (let i = 0; i < n - r; i++) tris.push({ top: at[r][i], left: at[r - 1][i], right: at[r - 1][i + 1] });
  }
  return (shapes[n] = { n, cells, at, tris });
}

function pascal(m) {
  const row = [1];
  for (let k = 1; k <= m; k++) row.push(row[k - 1] * (m - k + 1) / k);
  return row;
}

// Würfelt eine Grundreihe, bei der die Spitze (und damit jeder Stein)
// höchstens max ist, aber auch nicht viel kleiner – sonst bleibt der
// Zahlenraum ungenutzt.
function grundreihe(n, max) {
  const coef = pascal(n - 1);
  const minTop = Math.round(max * 0.55);
  for (let t = 0; t < 500; t++) {
    const b = new Array(n).fill(1);
    // Bei sechs Stockwerken wird es unten sehr eng: ein Stein darf auch mal 0 sein
    if (n >= 6 && Math.random() < 0.5) b[rnd(1, n - 2)] = 0;
    let top = b.reduce((s, x, i) => s + x * coef[i], 0);
    for (const i of shuffle(range(n))) {
      const add = rnd(0, Math.floor((max - top) / coef[i]));
      b[i] += add;
      top += add * coef[i];
    }
    if (top >= minTop) return b;
  }
  return new Array(n).fill(1);
}

function werte(geo, bottom) {
  const v = new Array(geo.cells.length);
  bottom.forEach((x, i) => { v[geo.at[0][i]] = x; });
  for (const t of geo.tris) v[t.top] = v[t.left] + v[t.right];
  return v;
}

// Alle Steine, die sich mit dem jetzigen Wissen in einem Schritt ausrechnen lassen
function schritte(geo, known) {
  const plus = [], minus = [];
  for (const t of geo.tris) {
    const a = known[t.top], b = known[t.left], c = known[t.right];
    if (a + b + c !== 2) continue;
    if (!a) plus.push({ cell: t.top, from: [t.left, t.right], op: '+' });
    else if (!b) minus.push({ cell: t.left, from: [t.top, t.right], op: '−' });
    else minus.push({ cell: t.right, from: [t.top, t.left], op: '−' });
  }
  return { plus, minus };
}

// Löst so, wie ein Kind es täte: alles mit Plus, und Minus nur, wenn es
// anders nicht weitergeht. ok = lösbar ohne Raten; minus = Minus-Schritte.
function analyse(geo, known) {
  const k = known.slice();
  let open = k.filter(x => !x).length, minus = 0;
  while (open > 0) {
    const s = schritte(geo, k);
    if (s.plus.length) {
      for (const st of s.plus) if (!k[st.cell]) { k[st.cell] = true; open--; }
      continue;
    }
    if (!s.minus.length) return { ok: false, minus };
    k[s.minus[0].cell] = true;
    open--;
    minus++;
  }
  return { ok: true, minus };
}

const abstand = (x, [lo, hi]) => (x < lo ? lo - x : x > hi ? x - hi : 0);

// Baut eine Pyramide für eine Stufe: Zahlen würfeln, dann so lange Steine
// herausnehmen, wie sie sich noch Schritt für Schritt ausrechnen lässt.
// Von vielen Versuchen gewinnt der, der am besten zur Stufe passt.
function baue(level) {
  const L = LEVELS[level], geo = shape(L.n);
  const values = werte(geo, grundreihe(L.n, L.max));
  let best = null;
  for (let t = 0; t < 300 && !(best && best.cost === 0); t++) {
    const ziel = rnd(L.leer[0], L.leer[1]);
    const known = new Array(geo.cells.length).fill(true);
    let leer = 0;
    for (const c of shuffle(range(geo.cells.length))) {
      if (leer === ziel) break;
      if (L.unten && geo.cells[c].r === 0) continue;
      known[c] = false;
      if (analyse(geo, known).ok) leer++;
      else known[c] = true;
    }
    const minus = analyse(geo, known).minus;
    const cost = 2 * abstand(leer, L.leer) + abstand(minus, L.minus);
    if (!best || cost < best.cost) best = { known, leer, minus, cost };
  }
  return { level, geo, values, given: best.known, leer: best.leer, minus: best.minus };
}

/* =====================================================================
   SPEICHER
   ===================================================================== */
const STORE = 'y7.pyr.';
const stand = laden();
function laden() {
  const s = { skill: 0, solved: 0, ton: true, intro: false };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE + 'stand') || 'null');
    if (raw && typeof raw === 'object') {
      if (Number.isFinite(raw.skill)) s.skill = clamp(raw.skill, 0, LEVELS.length - 0.01);
      if (Number.isInteger(raw.solved) && raw.solved >= 0) s.solved = raw.solved;
      if (typeof raw.ton === 'boolean') s.ton = raw.ton;
      if (raw.intro === true) s.intro = true;
    }
  } catch (e) { /* privater Modus o.ä. */ }
  return s;
}
function speichern() {
  try { localStorage.setItem(STORE + 'stand', JSON.stringify(stand)); } catch (e) { /* privater Modus o.ä. */ }
}
const stufe = () => Math.min(LEVELS.length - 1, Math.floor(stand.skill));

// Passt die Schwierigkeit an. q = Anteil der Steine, die ohne Fehler und
// ohne Tipp gelöst wurden. Um 70 % herum bleibt die Stufe, darüber geht es
// hoch, darunter wieder runter. Grosse Pyramiden zählen etwas mehr.
function anpassen(q, leer) {
  const vorher = stufe();
  let s = stand.skill + clamp((q - 0.7) * (0.9 + 0.03 * leer), -0.6, 0.45);
  s = clamp(s, 0, LEVELS.length - 0.01);
  const nachher = Math.min(LEVELS.length - 1, Math.floor(s));
  if (nachher > vorher) s = nachher + 0.15;       // frisch aufgestiegen: kleiner Puffer
  else if (nachher < vorher) s = nachher + 0.6;   // zurückgestuft: bald wieder hoch
  stand.skill = s;
  return nachher - vorher;
}

/* =====================================================================
   TÖNE (selbst erzeugt, keine Dateien)
   ===================================================================== */
const Ton = (() => {
  let ctx = null;
  function ac() {
    if (!stand.ton) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function note(f, t0, dur, type = 'sine', vol = 0.12, to = 0) {
    const c = ac();
    if (!c) return;
    const t = c.currentTime + t0;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  return {
    tipp() { note(700, 0, 0.06, 'triangle', 0.05); },
    richtig() { note(784, 0, 0.12, 'triangle', 0.12); note(1175, 0.09, 0.22, 'triangle', 0.1); },
    falsch() { note(330, 0, 0.28, 'sine', 0.13, 210); },
    fertig() {
      [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.11, 0.3, 'triangle', 0.11));
      note(1319, 0.5, 0.55, 'sine', 0.08);
    },
    stufe() { [659, 784, 988, 1319, 1568].forEach((f, i) => note(f, i * 0.09, 0.28, 'square', 0.035)); },
    freund() { [1047, 1319, 1568, 2093].forEach((f, i) => note(f, i * 0.08, 0.4, 'sine', 0.07)); },
  };
})();

/* =====================================================================
   OBERFLÄCHE
   ===================================================================== */
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const pyrEl = $('pyramid'), boxEl = $('pyrbox'), capyEl = $('capy'), dockEl = $('dock');
const sayEl = $('say'), bubbleEl = $('bubble');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let P = null;          // die aktuelle Pyramide
let zellen = [];       // Knöpfe der Steine, Index wie in P.values
let sel = -1;          // ausgewählter Stein
let getippt = '';      // bisher getippte Ziffern
let sperre = false;    // kurz gesperrt, während geprüft wird
let crownEl = null;
let letzte = '';

function neuePyramide() {
  const lvl = stufe();
  let p, key;
  do {
    p = baue(lvl);
    key = p.values.join(',') + '|' + p.given.join(',');
  } while (key === letzte);
  letzte = key;
  P = Object.assign(p, {
    known: p.given.slice(),
    fails: new Map(),    // Fehlversuche pro Stein
    hinted: new Set(),   // Steine mit Tipp
    done: false,
  });
  sel = -1;
  getippt = '';
  sperre = false;
  dockEl.classList.remove('done');
  aufbauen();
  waehle(naechster(-1));
  sagen(stand.solved < 2 ? TEXT.first : pick(TEXT.start));
  stufeZeigen();
}

function aufbauen() {
  const geo = P.geo, n = geo.n;
  pyrEl.innerHTML = '';
  pyrEl.classList.remove('cheer');
  zellen = [];
  crownEl = document.createElement('div');
  crownEl.className = 'crown';
  crownEl.innerHTML = '<svg viewBox="0 0 40 40"><use href="#mandarine"/></svg>';
  pyrEl.appendChild(crownEl);
  for (let r = n - 1; r >= 0; r--) {
    const row = document.createElement('div');
    row.className = 'row';
    for (const c of geo.at[r]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.dataset.c = c;
      if (!reduce) {
        b.classList.add('build');
        b.style.setProperty('--d', (r * 0.11 + geo.cells[c].i * 0.035).toFixed(3) + 's');
        b.addEventListener('animationend', () => b.classList.remove('build'), { once: true });
      }
      b.style.setProperty('--w', ((n - 1 - r) * 0.06 + geo.cells[c].i * 0.03).toFixed(3) + 's');
      row.appendChild(b);
      zellen[c] = b;
    }
    pyrEl.appendChild(row);
  }
  einpassen();
  zellen.forEach((_, c) => zeichne(c));
}

// Grösse der Steine an den Platz anpassen
function einpassen() {
  if (!P) return;
  const n = P.geo.n;
  const W = boxEl.clientWidth, H = boxEl.clientHeight - $('ground').offsetHeight - 10;
  const ratio = 0.72;
  const gap = clamp(Math.round(Math.min(W, H) / 80), 4, 9);
  const byW = (W - (n - 1) * gap) / n;
  const byH = (H - n * gap) / ((n + 0.8) * ratio);
  const bw = Math.floor(clamp(Math.min(byW, byH, 150), 30, 150));
  pyrEl.style.setProperty('--bw', bw + 'px');
  pyrEl.style.setProperty('--bh', Math.round(bw * ratio) + 'px');
  pyrEl.style.setProperty('--gap', gap + 'px');
}

function zeichne(c) {
  const b = zellen[c];
  if (!b) return;
  const bekannt = P.known[c], gegeben = P.given[c];
  b.classList.toggle('given', gegeben);
  b.classList.toggle('solved', bekannt && !gegeben);
  b.classList.toggle('blank', !bekannt);
  b.classList.toggle('sel', c === sel && !bekannt);
  b.tabIndex = bekannt ? -1 : 0;
  if (bekannt) {
    b.textContent = P.values[c];
    b.setAttribute('aria-label', String(P.values[c]));
  } else if (c === sel) {
    b.innerHTML = '';
    const t = document.createElement('span');
    t.className = 'typed';
    t.textContent = getippt;
    if (getippt.length < 2) {
      const k = document.createElement('span');
      k.className = 'caret';
      t.appendChild(k);
    }
    b.appendChild(t);
    b.setAttribute('aria-label', 'Leerer Stein, ausgewählt' + (getippt ? ': ' + getippt : ''));
  } else {
    b.textContent = '';
    b.setAttribute('aria-label', 'Leerer Stein');
  }
}

function hinweiseWeg() {
  zellen.forEach(z => z.classList.remove('hint'));
}

function waehle(c) {
  if (c < 0 || !P || P.known[c]) return;
  const alt = sel;
  sel = c;
  getippt = '';
  hinweiseWeg();
  if (alt >= 0) zeichne(alt);
  zeichne(c);
}

// Position eines Steins auf dem Bildschirm, in Steinbreiten
const lage = c => { const z = P.geo.cells[c]; return { x: z.i + z.r / 2, y: z.r }; };
function naechsterVon(pool, von) {
  if (!pool.length) return -1;
  if (von < 0) return pool.slice().sort((a, b) => lage(a).y - lage(b).y || lage(a).x - lage(b).x)[0];
  const p = lage(von);
  let best = pool[0], bd = Infinity;
  for (const c of pool) {
    const q = lage(c), d = Math.abs(q.x - p.x) + Math.abs(q.y - p.y) * 1.2;
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
// Der nächste Stein, den man jetzt ausrechnen kann – am liebsten mit Plus
function naechster(von) {
  const s = schritte(P.geo, P.known);
  let pool = (s.plus.length ? s.plus : s.minus).map(x => x.cell);
  if (!pool.length) pool = range(P.values.length).filter(c => !P.known[c]);
  return naechsterVon(pool, von);
}

function schrittFuer(c) {
  const s = schritte(P.geo, P.known);
  return s.plus.find(x => x.cell === c) || s.minus.find(x => x.cell === c) || null;
}

/* ---------- Sprechblase und Capy ---------- */
function sagen(text, html) {
  if (html) sayEl.innerHTML = html; else sayEl.textContent = text;
  bubbleEl.classList.remove('pop');
  void bubbleEl.offsetWidth;
  bubbleEl.classList.add('pop');
}
let moodTimer = 0;
function stimmung(m, ms) {
  capyEl.classList.remove('happy', 'oops');
  void capyEl.getBoundingClientRect();
  clearTimeout(moodTimer);
  if (!m) return;
  capyEl.classList.add(m);
  if (ms) moodTimer = setTimeout(() => capyEl.classList.remove(m), ms);
}

/* ---------- Eingabe ---------- */
function ziffer(d) {
  if (!P || P.done || sperre) return;
  if (sel < 0) waehle(naechster(-1));
  if (getippt.length >= 2) return;
  if (getippt === '0') getippt = '';
  getippt += d;
  Ton.tipp();
  zeichne(sel);
  // Zwei Ziffern sind immer eine ganze Zahl (alles bleibt unter 100)
  if (getippt.length === 2) {
    sperre = true;
    setTimeout(() => { sperre = false; pruefen(); }, 260);
  }
}

function loeschen() {
  if (!P || P.done || sperre || sel < 0 || !getippt) return;
  getippt = getippt.slice(0, -1);
  Ton.tipp();
  zeichne(sel);
}

function pruefen() {
  if (!P || P.done || sperre || sel < 0) return;
  if (!getippt) {
    zellen[sel].classList.remove('shake');
    void zellen[sel].offsetWidth;
    zellen[sel].classList.add('shake');
    return;
  }
  const c = sel, b = zellen[c];
  if (parseInt(getippt, 10) === P.values[c]) {
    P.known[c] = true;
    getippt = '';
    hinweiseWeg();
    zeichne(c);
    b.classList.remove('pop', 'shake');
    void b.offsetWidth;
    b.classList.add('pop');
    Ton.richtig();
    if (P.known.every(Boolean)) { fertig(); return; }
    stimmung('happy', 900);
    sagen(pick(TEXT.ok));
    waehle(naechster(c));
    return;
  }
  // falsch
  const f = (P.fails.get(c) || 0) + 1;
  P.fails.set(c, f);
  getippt = '';
  Ton.falsch();
  stimmung('oops', 800);
  b.classList.remove('shake', 'pop');
  void b.offsetWidth;
  b.classList.add('shake', 'wrong');
  setTimeout(() => b.classList.remove('wrong'), 450);
  zeichne(c);
  if (f === 1) { sagen(pick(TEXT.wrong)); return; }
  const st = schrittFuer(c);
  if (!st) {
    // Dieser Stein geht noch gar nicht – zu einem führen, der geht
    const k = naechster(c);
    waehle(k);
    zeigeSchritt(schrittFuer(k), TEXT.tricky);
    return;
  }
  if (f === 2) zeigeSchritt(st);
  else {
    zeigeSchritt(st, null, true);
  }
}

// Markiert die zwei Steine, mit denen man rechnet, und sagt die Rechnung
function zeigeSchritt(st, vorne, loesung) {
  if (!st) return;
  hinweiseWeg();
  st.from.forEach(x => zellen[x].classList.add('hint'));
  const a = P.values[st.from[0]], b = P.values[st.from[1]];
  const rechnung = `${a} ${st.op} ${b}`;
  let html = (vorne ? esc(vorne) + ' ' : '') + 'Rechne: <span class="op">' + rechnung + '</span>';
  if (loesung) html = 'Rechne: <span class="op">' + rechnung + ' = ' + P.values[st.cell] + '</span>. Tippe es ein!';
  sagen('', html);
}
const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));

function tipp() {
  if (!P || P.done) return;
  let st = sel >= 0 ? schrittFuer(sel) : null;
  if (!st) {
    const k = naechster(sel);
    waehle(k);
    st = schrittFuer(k);
  }
  if (!st) return;
  P.hinted.add(st.cell);
  Ton.tipp();
  zeigeSchritt(st);
}

/* ---------- Geschafft ---------- */
function fertig() {
  P.done = true;
  const alt = sel;
  sel = -1;
  if (alt >= 0) zeichne(alt);
  hinweiseWeg();
  // Fehler zählen: höchstens zwei pro Stein, ein Tipp zählt wie ein Fehler
  let fehler = 0;
  range(P.values.length).forEach(c => {
    if (P.given[c]) return;
    fehler += Math.min(2, (P.fails.get(c) || 0) + (P.hinted.has(c) ? 1 : 0));
  });
  const q = Math.max(0, 1 - fehler / P.leer);
  const sprung = anpassen(q, P.leer);
  stand.solved++;
  speichern();

  Ton.fertig();
  stimmung('happy', 1800);
  sagen(pick(TEXT.done));
  konfetti();
  // Alles Spätere nur, solange noch diese Pyramide zu sehen ist
  const diese = P;
  const spaeter = (fn, ms) => setTimeout(() => { if (P === diese) fn(); }, ms);
  spaeter(() => pyrEl.classList.add('cheer'), 200);
  spaeter(mandarineFliegt, 350);
  spaeter(() => sagen(pick(TEXT.facts)), 2600);
  // «Weiter» erst nach einem Moment, damit ein Doppeltipp die Feier nicht überspringt
  spaeter(() => { P.bereit = true; dockEl.classList.add('done'); }, 700);

  const freund = FRIENDS.find(f => f.at === stand.solved);
  if (sprung > 0) {
    meldung('stern', 'Stufe ' + (stufe() + 1) + '!', 'Du wirst immer besser!', () => Ton.stufe(), 1500);
  }
  if (freund) {
    meldung('f-' + freund.id, 'Neuer Freund: ' + freund.name, freund.text, () => {
      Ton.freund();
      freundeZeigen(freund.id);
    }, sprung > 0 ? 0 : 1500);
  }
  setTimeout(stufeZeigen, 1200);
}

function weiter() {
  if (!P || !P.bereit) return;
  zaehlen();
  neuePyramide();
}

/* ---------- Effekte ---------- */
function konfetti() {
  if (reduce) return;
  const fx = $('fx');
  const arten = ['mandarine', 'blatt', 'bluete', 'herz', 'mandarine', 'bluete-weiss'];
  for (let i = 0; i < 30; i++) {
    const s = document.createElementNS(SVGNS, 'svg');
    const art = pick(arten);
    s.setAttribute('viewBox', art === 'mandarine' ? '0 0 40 40' : '0 0 30 30');
    const u = document.createElementNS(SVGNS, 'use');
    u.setAttribute('href', '#' + art);
    s.appendChild(u);
    const size = rnd(18, 36);
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    fx.appendChild(s);
    const drift = rnd(-80, 80), rot = rnd(-400, 400);
    s.animate([
      { transform: 'translate(0, -60px) rotate(0deg)' },
      { transform: `translate(${drift}px, calc(100vh + 60px)) rotate(${rot}deg)` },
    ], { duration: rnd(1800, 3000), delay: rnd(0, 500), easing: 'cubic-bezier(.35,.1,.6,1)', fill: 'both' })
      .onfinish = () => s.remove();
  }
}

// Zähler oben nachführen; mehrfach aufrufen schadet nicht
function zaehlen() {
  const s = $('solved');
  if (s.textContent === String(stand.solved)) return;
  s.textContent = stand.solved;
  const k = $('count');
  k.classList.remove('bump');
  void k.offsetWidth;
  k.classList.add('bump');
}

function mandarineFliegt() {
  const ziel = $('countIcon');
  // Falls die Animation hängt (z.B. Tab im Hintergrund), zählt es trotzdem
  setTimeout(zaehlen, 1300);
  if (!crownEl || reduce) { zaehlen(); return; }
  const a = crownEl.getBoundingClientRect(), z = ziel.getBoundingClientRect();
  if (!a.width) { zaehlen(); return; }
  const f = document.createElementNS(SVGNS, 'svg');
  f.setAttribute('viewBox', '0 0 40 40');
  f.innerHTML = '<use href="#mandarine"/>';
  Object.assign(f.style, { position: 'fixed', left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px', zIndex: 26, pointerEvents: 'none' });
  document.body.appendChild(f);
  crownEl.style.visibility = 'hidden';
  const dx = z.left + z.width / 2 - (a.left + a.width / 2);
  const dy = z.top + z.height / 2 - (a.top + a.height / 2);
  const sc = z.width / a.width;
  f.animate([
    { transform: 'translate(0, 0) scale(1) rotate(0deg)' },
    { transform: `translate(${dx * 0.35}px, ${dy * 0.35 - 70}px) scale(1.35) rotate(160deg)`, offset: 0.45 },
    { transform: `translate(${dx}px, ${dy}px) scale(${sc}) rotate(360deg)` },
  ], { duration: 950, easing: 'ease-in-out', fill: 'forwards' }).onfinish = () => { f.remove(); zaehlen(); };
}

// Kleine Meldungen oben, eine nach der anderen
const meldungen = [];
let meldungLaeuft = false;
function meldung(symbol, titel, text, beimZeigen, warte) {
  // Eine neue Stufe macht ältere, noch wartende Stufen-Meldungen überflüssig
  if (symbol === 'stern') {
    for (let i = meldungen.length - 1; i >= 0; i--) if (meldungen[i].symbol === 'stern') meldungen.splice(i, 1);
  }
  meldungen.push({ symbol, titel, text, beimZeigen, warte: warte || 0 });
  if (!meldungLaeuft) naechsteMeldung();
}
function naechsteMeldung() {
  const m = meldungen.shift();
  if (!m) { meldungLaeuft = false; return; }
  meldungLaeuft = true;
  setTimeout(() => {
    const vb = { stern: '0 0 40 40', 'f-schmetterling': '0 0 60 50', 'f-vogel': '0 0 44 36', 'f-schildkroete': '0 0 72 46', 'f-frosch': '0 0 60 50', 'f-ente': '0 0 58 48', 'f-baby': '0 0 80 74' }[m.symbol];
    $('toastIc').innerHTML = `<svg viewBox="${vb}"><use href="#${m.symbol}"/></svg>`;
    $('toastT').textContent = m.titel;
    $('toastS').textContent = m.text;
    $('toast').classList.add('show');
    if (m.beimZeigen) m.beimZeigen();
    setTimeout(() => {
      $('toast').classList.remove('show');
      setTimeout(naechsteMeldung, 550);
    }, 2800);
  }, m.warte);
}

function freundeZeigen(neu) {
  for (const f of FRIENDS) {
    const an = stand.solved >= f.at;
    document.querySelectorAll(`[data-f="${f.id}"]`).forEach(el => {
      el.classList.toggle('on', an);
      if (f.id === neu && !reduce) {
        el.classList.remove('arrive');
        void el.getBoundingClientRect();
        el.classList.add('arrive');
      }
    });
  }
}

function stufeZeigen() {
  const l = stufe();
  $('lvl').textContent = l + 1;
  $('level').setAttribute('aria-label', 'Stufe ' + (l + 1));
  const anteil = l === LEVELS.length - 1 && stand.skill >= LEVELS.length - 0.02 ? 1 : stand.skill - l;
  $('lvlbar').style.width = Math.round(clamp(anteil, 0, 1) * 100) + '%';
}

function tonZeigen() {
  $('sound').querySelector('use').setAttribute('href', stand.ton ? '#i-ton' : '#i-stumm');
  $('sound').setAttribute('aria-label', stand.ton ? 'Ton ausschalten' : 'Ton einschalten');
}

/* ---------- Hilfe / Start ---------- */
let resetScharf = false;
function hilfe(zeigen) {
  const o = $('intro');
  if (zeigen) {
    $('stats').textContent = stand.solved
      ? `Gelöste Pyramiden: ${stand.solved} · Stufe ${stufe() + 1} von ${LEVELS.length}`
      : '';
    resetScharf = false;
    $('reset').textContent = 'Fortschritt löschen';
    $('reset').hidden = !stand.solved;
    o.hidden = false;
  } else {
    o.hidden = true;
    if (!stand.intro) { stand.intro = true; speichern(); }
  }
}

/* ---------- Ereignisse ---------- */
pyrEl.addEventListener('click', e => {
  const b = e.target.closest('.cell');
  if (!b || !P || P.done || sperre) return;
  const c = +b.dataset.c;
  if (P.known[c]) return;
  if (c !== sel) { waehle(c); Ton.tipp(); }
});
$('pad').addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  const v = k.dataset.k;
  if (v === 'back') loeschen();
  else if (v === 'ok') pruefen();
  else ziffer(v);
});
$('tipp').addEventListener('click', tipp);
$('next').addEventListener('click', weiter);
$('sound').addEventListener('click', () => {
  stand.ton = !stand.ton;
  speichern();
  tonZeigen();
  if (stand.ton) Ton.richtig();
});
$('help').addEventListener('click', () => hilfe(true));
$('go').addEventListener('click', () => hilfe(false));
$('reset').addEventListener('click', () => {
  if (!resetScharf) {
    resetScharf = true;
    $('reset').textContent = 'Wirklich alles löschen? Nochmal tippen.';
    return;
  }
  stand.skill = 0;
  stand.solved = 0;
  speichern();
  zaehlen();
  freundeZeigen();
  hilfe(false);
  neuePyramide();
});
// Zahlen kommen nur über die Tasten oben. Absichtlich gibt es kein Textfeld
// und keine Tastatur-Abfrage: so geht die Bildschirmtastatur des Tablets nie auf.

if (window.ResizeObserver) new ResizeObserver(einpassen).observe(boxEl);
else window.addEventListener('resize', einpassen);

/* ---------- Los ---------- */
$('solved').textContent = stand.solved;
tonZeigen();
freundeZeigen();
neuePyramide();
if (!stand.intro) hilfe(true);

// Als App installierbar und ohne Internet spielbar (siehe sw.js)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>

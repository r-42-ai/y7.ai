<!DOCTYPE html>

  html, body { height: 100%; }
  body {
    margin: 0;
    background: #120907;
    color: #804433;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .mark { width: min(26vw, 108px); height: auto; display: block; }
  p {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b3a2c;
  }
  nav { display: flex; gap: 26px; }
  a {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #804433;
    text-decoration: none;
    transition: color 0.45s ease;
  }
  a:hover, a:focus-visible { color: #b56f5c; }
  a:focus-visible { outline: 1px solid #804433; outline-offset: 6px; }
  /* No entrance fade here, deliberately. The landing page can afford one, but
     an `animation: ... both` starts at opacity 0 and only becomes visible if
     the animation actually runs - a bad bet on the page people reach when
     something has already gone wrong. This one is visible the moment it
     paints. Matched paths never paint it at all; they redirect from <head>. */
</style>
